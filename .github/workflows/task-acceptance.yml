name: Task Acceptance

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: read

jobs:
  task-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enforce task self-acceptance protocol
        run: node scripts/check-task-acceptance.js
