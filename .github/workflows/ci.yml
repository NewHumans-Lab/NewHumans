name: P0-P1 CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: newhumans
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d newhumans"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/newhumans
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enforce PERFECT_REPLACEMENT audit
        if: github.event_name == 'pull_request'
        run: node scripts/check-replacement-audit.js
      - run: npm install
      - run: npm run migrate
      - run: npm test
